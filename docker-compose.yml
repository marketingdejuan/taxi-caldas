services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: taxi_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: taxi_dispatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: taxi_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: taxi_evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: cambia_esta_clave_segura_2026
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://admin:admin123@postgres:5432/taxi_dispatch?schema=evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:4000/webhook/whatsapp
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
